name: Compilar APK Matibatidos RC6 Independiente

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK independiente
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar estructura del proyecto
        shell: bash
        run: |
          set -e

          echo "===== RAIZ DEL PROYECTO ====="
          ls -la

          echo "===== VERIFICANDO ARCHIVOS ====="

          check_file() {
            if [ -f "$1" ]; then
              echo "OK: $1"
            else
              echo "FALTA: $1"
              return 1
            fi
          }

          check_file settings.gradle
          check_file build.gradle
          check_file app/build.gradle
          check_file app/src/main/AndroidManifest.xml
          check_file app/src/main/assets/index.html

          echo "===== BUSCANDO ACTIVIDAD ANDROID ====="

          ACTIVITY=$(find app/src/main -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print -quit)

          if [ -z "$ACTIVITY" ]; then
            echo "ERROR: No se encontró MainActivity."
            find app/src/main -type f
            exit 1
          fi

          echo "Actividad encontrada: $ACTIVITY"

          echo "===== VERIFICANDO IDENTIFICADOR ====="

          if grep -Eq "applicationId[[:space:]]*['\"]com\.matibatidos\.pos\.rc6['\"]" app/build.gradle; then
            echo "OK: APK independiente."
          else
            echo "ERROR: El applicationId no es com.matibatidos.pos.rc6."
            grep -n "applicationId" app/build.gradle || true
            exit 1
          fi

          echo "===== BUSCANDO ICONOS ====="

          ICON=$(find app/src/main/res \
            -type f \
            \( -name "*.png" -o -name "*.webp" -o -name "*.xml" \) \
            \( -path "*/mipmap*/*" -o -path "*/drawable*/*" \) \
            -print -quit)

          if [ -z "$ICON" ]; then
            echo "ERROR: No se encontraron recursos de icono."
            exit 1
          fi

          echo "Recurso de icono encontrado: $ICON"
          echo "Verificación terminada."

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verificar APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: No se generó la APK."
            exit 1
          fi

          echo "APK generada:"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Publicar APK independiente
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-INDEPENDIENTE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
