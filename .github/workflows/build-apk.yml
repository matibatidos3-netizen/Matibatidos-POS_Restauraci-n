name: Compilador APK Matibatidos Independiente

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Matibatidos RC6
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar repositorio
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2. Configurar Java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Extraer ZIP y localizar proyecto
      - name: Extraer y localizar proyecto Android
        id: locate
        shell: bash
        run: |
          set -e

          ZIP="Matibatidos_RC6_RESTAURACION_COMPATIBLE_APK_INDEPENDIENTE.zip"

          echo "Buscando archivo del proyecto..."

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP."
            ls -la
            exit 1
          fi

          mkdir -p extracted_project

          echo "Extrayendo ZIP..."
          unzip -oq "$ZIP" -d extracted_project

          echo "Buscando configuración Gradle..."

          SETTINGS=$(find extracted_project \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle."
            find extracted_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto localizado:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 4. Verificar estructura
      - name: Verificar archivos del proyecto
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Verificando archivos..."

          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Buscando MainActivity..."

          ACTIVITY=$(find app/src/main \
            -type f \
            \( -name MainActivity.java -o -name MainActivity.kt \) \
            -print -quit)

          if [ -z "$ACTIVITY" ]; then
            echo "ERROR: No se encontró MainActivity."
            exit 1
          fi

          echo "Actividad encontrada: $ACTIVITY"

          echo "Comprobando identificador independiente..."

          if ! grep -Eq "applicationId[[:space:]]*=?[[:space:]]*['\"]com\.matibatidos\.pos\.rc6['\"]" app/build.gradle app/build.gradle.kts 2>/dev/null; then
            echo "ERROR: Identificador independiente incorrecto."
            grep -n "applicationId" app/build.gradle app/build.gradle.kts 2>/dev/null || true
            exit 1
          fi

          echo "Identificador independiente confirmado."
          echo "Verificación terminada."

      # 5. Preparar SDK Android sin reemplazar herramientas
      - name: Preparar SDK Android
        shell: bash
        run: |
          set -e

          echo "Localizando SDK Android..."

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: No existe el directorio del SDK: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            find "$SDK_ROOT" -name sdkmanager -type f || true
            exit 1
          fi

          echo "SDK: $SDK_ROOT"
          echo "SDK Manager: $SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Aceptando licencias Android..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses >/dev/null || true

          echo "Instalando plataformas y herramientas..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          echo "SDK preparado correctamente."

      # 6. Configurar Gradle
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Verificar Gradle
      - name: Comprobar Gradle
        run: |
          gradle --version

      # 8. Compilar APK
      - name: Compilar APK independiente
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Iniciando compilación..."

          gradle \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

          echo "Compilación terminada."

      # 9. Localizar y verificar APK
      - name: Verificar APK generada
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó la APK."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: El archivo APK está vacío."
            exit 1
          fi

          echo "APK encontrada:"
          ls -lh "$APK"

          echo "Calculando SHA256..."
          sha256sum "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # 10. Publicar APK
      - name: Publicar APK independiente
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-INDEPENDIENTE
          path: ${{ steps.locate.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
