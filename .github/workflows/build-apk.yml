name: Compilar APK Matibatidos RC6 Independiente

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK independiente
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer y localizar proyecto Android
        id: locate
        shell: bash
        run: |
          set -e

          ZIP="Matibatidos_RC6_RESTAURACION_COMPATIBLE_APK_INDEPENDIENTE.zip"

          echo "Buscando ZIP del proyecto..."

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró $ZIP"
            ls -la
            exit 1
          fi

          mkdir -p extracted_project

          echo "Extrayendo proyecto..."
          unzip -oq "$ZIP" -d extracted_project

          echo "Buscando settings.gradle..."

          SETTINGS=$(find extracted_project \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle."
            echo "Contenido extraído:"
            find extracted_project -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar archivos del proyecto
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Verificando estructura..."

          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Buscando actividad Android..."

          ACTIVITY=$(find app/src/main \
            -type f \
            \( -name MainActivity.java -o -name MainActivity.kt \) \
            -print -quit)

          if [ -z "$ACTIVITY" ]; then
            echo "ERROR: No se encontró MainActivity."
            exit 1
          fi

          echo "Actividad: $ACTIVITY"

          echo "Verificando identificador independiente..."

          if ! grep -Eq "applicationId[[:space:]]*['\"]com\.matibatidos\.pos\.rc6['\"]" app/build.gradle app/build.gradle.kts 2>/dev/null; then
            echo "ERROR: No se encontró el identificador independiente."
            exit 1
          fi

          echo "Proyecto verificado."

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verificar APK generada
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó la APK."
            exit 1
          fi

          echo "APK generada:"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-INDEPENDIENTE
          path: ${{ steps.locate.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
